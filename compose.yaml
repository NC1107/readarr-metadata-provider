# Minimal setup: run the metadata server, then point Readarr/Bookshelf at it
# with ./switch.sh --readarr http://readarr:8787 --api-key <key> --to http://metadata:8816/
services:
  metadata:
    image: ghcr.io/nc1107/readarr-metadata-provider:latest
    # Swap for `build: .` to run your own build instead of the published image.
    container_name: readarr-metadata-provider
    restart: unless-stopped
    ports:
      - "8816:8816"
    volumes:
      # The dataset lives here and survives image updates. On first boot the
      # server downloads it, verifies it against the published checksum, and
      # serves it; after that it works offline.
      - readarr-metadata:/data
    environment:
      # Check for a newer dataset on boot and this often after; 0 pins the
      # one you have. New datasets are published weekly. A refresh needs room
      # for a second copy of the dataset while the new one downloads.
      - RMP_DATASET_REFRESH=6h
      - RMP_SEARCH_MIN_RATINGS=5
      - RMP_SEARCH_LANGUAGES=en
      #
      # Pin a specific snapshot instead of the newest published one:
      # - RMP_DATASET_URL=https://github.com/NC1107/readarr-metadata-provider/releases/download/dataset-20260830/metadata.db.zst
      #
      # The side-by-side comparison console at /ui. Off by default: it is
      # unauthenticated and queries the public rreading-glasses instance (and
      # hardcover, with a token) on a visitor's behalf, so only turn it on
      # where nobody else can reach the port.
      # - RMP_WEB=true
      # - HARDCOVER_TOKEN=hc_pat_...
      #
      # Every flag has an RMP_ environment variable (RMP_ADDR, RMP_MAX_WORKS,
      # ...); see README.md. The older unprefixed names still work.

volumes:
  readarr-metadata:
