# Minimal setup: run the metadata server, then point Readarr/Bookshelf at it
# with ./switch.sh --readarr http://readarr:8787 --api-key <key> --to http://metadata:8816/
services:
  metadata:
    image: ghcr.io/nc1107/readarr-metadata-provider:latest
    # Swap for `build: .` to run your own build instead of the published image.
    container_name: readarr-metadata-provider
    restart: unless-stopped
    ports:
      - "8816:8816"
    volumes:
      # The dataset lives here and survives image updates. On first boot the
      # server downloads it, verifies it against the published checksum, and
      # serves it; after that it works offline.
      - readarr-metadata:/data
    environment:
      # Set a HARDCOVER_TOKEN to enable the /ui console's live hardcover
      # comparison column. Serving does not need one.
      # - HARDCOVER_TOKEN=hc_pat_...
      #
      # Pin a specific snapshot instead of the newest published one:
      # - DATASET_URL=https://github.com/NC1107/readarr-metadata-provider/releases/download/dataset-20260830/metadata.db.zst
      # Check for a newer dataset on boot and this often after; 0 pins the
      # one you have. New datasets are published weekly.
      - DATASET_REFRESH=6h
      - SEARCH_MIN_RATINGS=5
      - SEARCH_LANGUAGES=en

volumes:
  readarr-metadata:
