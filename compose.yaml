# Minimal setup: run the metadata server, then point Readarr/Bookshelf at it
# with ./switch.sh --readarr http://readarr:8787 --api-key <key> --to http://metadata:8816/
services:
  metadata:
    build: .
    container_name: readarr-metadata-provider
    restart: unless-stopped
    ports:
      - "8816:8816"
    volumes:
      # The dataset lives here and survives image updates. Place metadata.db
      # in this volume (dataset auto-download on first boot is planned).
      - readarr-metadata:/data

volumes:
  readarr-metadata:
