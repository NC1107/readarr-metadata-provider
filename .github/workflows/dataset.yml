# Refreshes the dataset and publishes a new snapshot release.
#
# The full Hardcover catalog was seeded once (~11,600 API queries); that raw
# layer is preserved as the assets of the rolling "raw-data" release. This
# job downloads it, pulls only the rows changed since the last sync (delta
# mode, usually a few hundred queries), rebuilds the SQLite dataset, and
# publishes it - so the full seed never has to run again, on CI or anywhere.
#
# Weekly is enough: servers check for a newer dataset every 6 hours, so a
# publish reaches them the same day.
#
# Requires the HARDCOVER_TOKEN repository secret. Does nothing without it.
name: dataset

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday

permissions:
  contents: write

# Two dataset builds at once would race each other on the release; a manual
# dispatch while the schedule runs waits its turn instead.
concurrency:
  group: dataset
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Tokens expire every 1 January (see README); a missing or expired one
      # fails here, loudly, rather than three steps in.
      - name: Check secret
        run: |
          if [ -z "${{ secrets.HARDCOVER_TOKEN }}" ]; then
            echo "HARDCOVER_TOKEN secret is not set; the dataset cannot be refreshed" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download raw layer
        run: |
          mkdir -p data
          gh release download raw-data --dir /tmp/raw
          cat /tmp/raw/raw.tar.zst.part* 2>/dev/null | zstd -d | tar -x -C data \
            || zstd -d -c /tmp/raw/raw.tar.zst | tar -x -C data
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Delta sync
        run: |
          go run ./cmd/seed -mode delta -entity books
          go run ./cmd/seed -mode delta -entity book_links
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}

      - name: Build dataset
        run: go run ./cmd/build

      # Proves the artifact opens and answers before anyone downloads it. A
      # dataset that builds but cannot be served is worse than a failed
      # build, because it looks like a success.
      - name: Smoke test the dataset
        run: |
          set -euo pipefail
          go build -o bin/serve ./cmd/serve
          ./bin/serve -db data/dataset/metadata.db -dataset-url "" -dataset-refresh 0 -addr :8816 &
          for i in $(seq 30); do
            curl -fsS http://127.0.0.1:8816/healthz >/dev/null 2>&1 && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8816/healthz
          # The counts load in the background; give them a moment.
          for i in $(seq 60); do
            curl -fsS http://127.0.0.1:8816/ | grep -q '"ready":true' && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8816/ | tee /dev/stderr | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["dataset"]
          # A floor on the totals catches a build that emitted far too few
          # rows (a silently dropped table) even though it opens and serves.
          assert d["works"] > 2_000_000, f"too few works: {d}"
          assert d["authors"] > 1_000_000, f"too few authors: {d}"
          print("floor check ok:", d)'
          curl -fsS "http://127.0.0.1:8816/search?q=the+name+of+the+wind" | python3 -c '
          import json, sys
          r = json.load(sys.stdin); assert r, "search returned nothing"; print("search ok:", len(r), "results")'
          kill %1

      - name: Package
        run: scripts/package-dataset.sh data/dataset/metadata.db dist

      - name: Publish dataset snapshot
        run: |
          TAG="dataset-$(date -u +%Y%m%d)"
          # Rebuilding the same day is normal (a re-run, or a manual publish
          # earlier), so replace that day's release rather than failing on it.
          # Deleting keeps the git tag and lets create upload the assets
          # atomically, which re-uploading over existing assets does not.
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --title "Dataset $(date -u +%Y-%m-%d)" \
            --notes "Book metadata snapshot built from Hardcover data. See manifest.txt for checksums and reassembly."
          # The raw layer is a rolling helper release, not a dataset. GitHub's
          # releases/latest alias resolves to the newest non-prerelease, so it
          # must stay a prerelease or a fresh container could be pointed at it.
          gh release edit raw-data --prerelease 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Update raw layer
        run: |
          tar -c -C data raw state | zstd -T0 -8 > raw.tar.zst
          if [ "$(stat -c %s raw.tar.zst)" -gt $((1900*1024*1024)) ]; then
            split -b 1900M -d raw.tar.zst raw.tar.zst.part
            gh release upload raw-data raw.tar.zst.part* --clobber
          else
            gh release upload raw-data raw.tar.zst --clobber
          fi
        env:
          GH_TOKEN: ${{ github.token }}
